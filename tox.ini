[tox]
minversion = 4.28.0
envlist = py3,pep8
skipsdist = false

[testenv]
constraints =
  {env:TOX_CONSTRAINTS_FILE:https://releases.openstack.org/constraints/upper/master}
deps =
  -r{toxinidir}/requirements.txt
  -r{toxinidir}/test-requirements.txt
commands =
  stestr run --slowest {posargs}

[testenv:pep8]
commands = flake8

[testenv:cover]
setenv =
  PYTHON=coverage run
commands =
  coverage erase
  {[testenv]commands}
  coverage combine
  coverage html -d cover
  coverage xml -o cover/coverage.xml
  coverage report

[testenv:venv]
commands = {posargs}

[testenv:functional]
setenv =
  OS_TEST_PATH=os_refresh_config/tests/functional
commands =
  stestr run --slowest {posargs}
  {toxinidir}/tools/tests/run_tests.sh {posargs}
allowlist_externals =
  {toxinidir}/tools/tests/run_tests.sh

[flake8]
# H904: Delay string interpolations at logging calls
enable-extensions = H904
ignore = E125
exclude = .venv,.tox,dist,doc,*.egg
show-source = true
